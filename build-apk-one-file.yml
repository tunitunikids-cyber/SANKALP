      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Package source
        shell: bash
        run: |
          zip -qr Sankalp-GitHub-Source.zip app build.gradle.kts settings.gradle.kts gradle.properties .gitignore README.md

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sankalp-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Sankalp-source
          path: Sankalp-GitHub-Source.zip
